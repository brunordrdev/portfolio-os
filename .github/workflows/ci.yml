name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Uma publicação de cada vez. Se dois pushes entrarem juntos na main, o
# segundo espera — mas não é cancelado, porque o primeiro pode já estar
# no meio de um deploy.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Os retratos comparam pixel a pixel, e pixel depende de quem desenha: os
  # mesmos widgets saem com 1,13% dos pontos diferentes num Mac arm64 e num
  # Linux x64. É mais do que a menor regressão real que dá para produzir de
  # propósito (0,40%), então não existe limiar que separe ruído de defeito.
  # A saída é conferir na mesma plataforma em que foram gerados.
  goldens:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.4
          cache: true

      - run: flutter pub get

      - run: flutter test --tags golden

  build:
    # Publicar sem os retratos conferidos seria publicar pintura sem gate.
    needs: goldens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Versão exata da máquina de desenvolvimento — Flutter 3.41.4,
          # canal stable, Dart 3.11.1. É ela que resolveu o pubspec.lock
          # commitado, e é o passo seguinte que cobra isso. Um "latest" que
          # muda sozinho transforma erro de compilador em mistério e faz o
          # CI compilar um programa diferente do que roda aqui.
          channel: stable
          flutter-version: 3.41.4
          cache: true

      - run: flutter pub get

      # Invariante que apodrece calada: o lock commitado tem que ser
      # exatamente o que o pub resolve com a versão fixada acima. Se o CI
      # mexer no lock, o build do CI deixou de ser o build local.
      - name: pubspec.lock não pode mudar
        run: |
          if ! git diff --exit-code pubspec.lock; then
            echo "::error::flutter pub get mexeu no pubspec.lock — o lock commitado não corresponde à versão do Flutter fixada no workflow."
            echo ""
            echo "O diff acima mostra o que mudou. Dois consertos possíveis:"
            echo ""
            echo "  - rodar 'flutter pub get' na máquina de desenvolvimento e"
            echo "    commitar o pubspec.lock resultante; ou"
            echo "  - devolver flutter-version, no passo subosito/flutter-action"
            echo "    acima, à versão que gerou o lock commitado."
            echo ""
            echo "Enquanto os dois divergirem, o que o CI compila e publica não é"
            echo "o que foi testado aqui."
            exit 1
          fi
          echo "pubspec.lock intacto: o CI resolveu exatamente o que está commitado."

      # --fatal-infos: info vira erro. Aviso que não quebra o build vira
      # ruído, e ruído acumulado deixa de ser lido.
      - run: flutter analyze --fatal-infos

      # A regra dura nº 1 do CLAUDE.md, verificada por máquina. Um analyze
      # limpo não vê esse vazamento: `Platform.isIOS` numa tela compila.
      - name: Verificar a costura
        run: |
          leaks=$(grep -rnE 'Platform\.|defaultTargetPlatform' lib --include='*.dart' \
                  | grep -v '^lib/core/platform/' || true)
          if [ -n "$leaks" ]; then
            echo "::error::A costura vazou: código fora de lib/core/platform/ está perguntando a plataforma direto."
            echo ""
            echo "Regra dura nº 1 do CLAUDE.md:"
            echo ""
            echo "  Nenhuma tela contém 'if (Platform.isIOS)' ou equivalente. Tudo que"
            echo "  muda entre plataformas vive atrás de PlatformSpec, em"
            echo "  lib/core/platform/platform_spec.dart. Se uma tela precisar saber a"
            echo "  plataforma, acrescente um membro à interface — nunca uma exceção"
            echo "  na tela."
            echo ""
            echo "Sem isso a troca iOS <-> Android deixa de acontecer num ponto só, e"
            echo "a tese do projeto para de valer. O conserto é na costura, não aqui."
            echo ""
            echo "Ocorrências encontradas:"
            echo "$leaks"
            exit 1
          fi
          echo "Costura íntegra: só lib/core/platform/ conhece a plataforma."

      # Os retratos rodam no outro job, na plataforma deles.
      - run: flutter test --exclude-tags golden

      # --wasm compila os dois alvos: dart2wasm/skwasm para quem tem WasmGC e
      # dart2js/canvaskit para o resto. O carregador escolhe, e o navegador
      # moderno baixa 1,8 MB em vez de 2,2 MB.
      - run: flutter build web --release --wasm

      # O build cospe 38 MB e o visitante toca em 11 arquivos. A pasta
      # canvaskit/ inteira — 31 MB, dos quais 6 MB são tabelas de símbolos de
      # depuração — nunca é pedida: o carregador busca o motor no CDN do
      # Google, com a revisão do engine no caminho. Medido em traço de rede,
      # nos dois alvos, e não deduzido.
      #
      # Se um dia o Flutter parar de usar o CDN, o motor deixa de existir para
      # o site e nada aqui reclama — quem reclama é a fumaça, logo abaixo, que
      # carrega o endereço publicado e cobra o app montando.
      - name: Tirar do deploy o que ninguém baixa
        run: |
          du -sh build/web
          rm -rf build/web/canvaskit
          find build/web -name '*.symbols' -delete
          du -sh build/web

      # ── Publicação ────────────────────────────────────────────────────
      # Só na main, e só em push: um pull request de fora não publica.
      - name: Deploy — Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy build/web --project-name=portfolio-os

      # ── Fumaça ────────────────────────────────────────────────────────
      #
      # O degrau que faltava. Tudo acima roda antes do build e enxerga o
      # repositório; nada disso vê o site montando. Os dois defeitos que
      # passaram batidos eram dessa classe — o service worker que não
      # registrava e a preferência que não voltava — e os dois estavam verdes
      # em teste que lia arquivo. Este carrega o endereço publicado num Chrome
      # de verdade e cobra comportamento.
      #
      # Depois do deploy de propósito: antes dele não há o que carregar.
      - name: Fumaça — o site publicado responde
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          # O Pages leva alguns segundos para o endereço devolver o deploy
          # novo. Três tentativas separam "ainda propagando" de "quebrado".
          for attempt in 1 2 3; do
            if dart run tool/smoke.dart https://portfolio-os-1rq.pages.dev; then
              exit 0
            fi
            echo "::warning::tentativa $attempt falhou; esperando o deploy propagar"
            sleep 20
          done
          echo "::error::o site publicado não passou na fumaça"
          exit 1
      #
      # O projeto "portfolio-os" precisa existir antes no painel do
      # Cloudflare Pages (Workers & Pages › Create › Pages › Direct Upload).
      # O fallback de SPA vem do arquivo web/_redirects, que o build copia
      # para build/web — sem ele, recarregar /sobre dá 404.
      #
      # ── Trocar de hospedagem ──────────────────────────────────────────
      #
      # GitHub Pages — ATENÇÃO ao caminho. Se o site não estiver na raiz do
      # domínio (usuario.github.io/portfolio em vez de brunordrdev.com), o
      # build precisa saber disso:
      #
      #     flutter build web --release --base-href /portfolio/
      #
      # Sem isso o app carrega numa tela branca: os assets são pedidos na
      # raiz e não estão lá. E o GitHub Pages ignora web/_redirects — o
      # contorno usual é copiar index.html para 404.html no build.
      #
      #   - uses: actions/upload-pages-artifact@v3
      #     with: { path: build/web }
      #   - uses: actions/deploy-pages@v4
      #   (exige permissions: pages: write, id-token: write no job)
      #
      # Netlify — lê web/_redirects sozinho, nada a configurar:
      #
      #   - uses: nwtgck/actions-netlify@v3
      #     with: { publish-dir: build/web, production-deploy: true }
      #     env:
      #       NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      #       NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      #
      # Vercel — o fallback de SPA vai em vercel.json, não em _redirects:
      #
      #   - uses: amondnet/vercel-action@v25
      #     with:
      #       vercel-token: ${{ secrets.VERCEL_TOKEN }}
      #       vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
      #       vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
      #       vercel-args: '--prod'
      #       working-directory: build/web
